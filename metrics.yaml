# Repository Health Analyzer — Metric weights and financial scorer config
# All 5 categories weighted equally at 20 pts (total 100)

weights:
  documentation: 20.0
  maintenance: 20.0
  ci_cd: 20.0
  governance: 20.0
  financial: 20.0

ignore: []

# --- Financial Impact Scorer ---
# Correlates corporate backer stock performance with repository vitality.
financial:
  # Corporate backer → ticker mapping.
  # Used to associate a repo with its sponsoring organization's stock.
  # Key can be a GitHub org/user, or "default" for fallback tickers.
  backers:
    default: [MSFT, GOOGL, AAPL]
    # Example overrides:
    # microsoft: [MSFT]
    # google: [GOOGL]
    # apple: [AAPL]
    # meta: [META]
    # amazon: [AMZN]
    # nvidia: [NVDA]

  # Scoring thresholds (applied to composite backer index)
  # Raw score is 0–20 pts, scaled to category weight
  thresholds:
    # 90-day price change %
    price_change:
      excellent: 15.0   # ≥ +15% → full points
      good: 5.0         # ≥ +5%
      neutral: -5.0     # ≥ -5%
      poor: -15.0       # ≥ -15%
    # Annualized volatility % (lower is better for stability signal)
    volatility:
      low: 20.0         # ≤ 20% → no penalty
      medium: 35.0      # ≤ 35%
      high: 50.0        # ≤ 50%
    # Minimum market cap (USD billions) for "established backer" bonus
    market_cap_bonus: 100.0

  # Offline cache — fallback quotes when Yahoo Finance is unreachable
  # (e.g. 451 blocks, no network). Last updated: 2026-07-25
  cache:
    MSFT:
      symbol: MSFT
      short_name: Microsoft Corporation
